# fly.toml app configuration file generated for valo-shop-worker on 2026-11-06T12:10:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'valo-shop-worker'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
